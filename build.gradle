plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
    
    id 'io.freefair.lombok' version '8.6'
    id 'maven-publish'
    id 'org.jetbrains.kotlin.jvm' version '2.0.21'
}

version = project.mod_version
group = project.maven_group
base.archivesName = 'Vertex-Client'

repositories {
	maven {
		url "https://maven.notenoughupdates.org/releases"
	}
	maven {
		name = "Modrinth"
		url = "https://api.modrinth.com/maven"
	}
	flatDir {
		dirs 'src/main/resources/libs', 'libs'
	}
	mavenCentral()
}

loom {
    accessWidenerPath = file("src/main/resources/vertexai.accesswidener")
}

dependencies {
	modImplementation "maven.modrinth:bQhBuv7x:2.2.0-1.21.11-fabric"
	include "maven.modrinth:bQhBuv7x:2.2.0-1.21.11-fabric"

	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	compileOnly 'org.projectlombok:lombok:1.18.30'
	annotationProcessor 'org.projectlombok:lombok:1.18.30'
	annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'
	modImplementation "net.fabricmc:fabric-language-kotlin:1.12.1+kotlin.2.0.20"
	include "net.fabricmc:fabric-language-kotlin:1.12.1+kotlin.2.0.20"

	modCompileOnly "maven.modrinth:modmenu:11.0.2"

	modImplementation "org.notenoughupdates.moulconfig:modern:3.3.0"
	include "org.notenoughupdates.moulconfig:modern:3.3.0"
	
	implementation "com.typesafe.akka:akka-actor_2.13:2.6.20"
}

task buildUi(type: Exec) {
    workingDir 'ui'
    if (System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('windows')) {
        commandLine 'cmd', '/c', 'npm', 'install', '&&', 'npm', 'run', 'build'
    } else {
        commandLine 'sh', '-c', 'npm install && npm run build'
    }
}

task copyUi(type: Copy) {
    dependsOn buildUi
    from 'ui/dist'
    into 'src/main/resources/assets/vertexai/gui/dist'
}

processResources {
    dependsOn copyUi
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    kotlinOptions {
        freeCompilerArgs += "-Xskip-metadata-version-check"
    }
}

tasks.named("sourcesJar") {
    mustRunAfter(tasks.named("copyUi"))
}

task copyToModrinth(type: Copy) {
    dependsOn remapJar
    doFirst {
        try {
            delete fileTree("${System.getProperty('user.home')}/AppData/Roaming/ModrinthApp/profiles/vertex/mods") {
                include "Vertex*1.0*.jar"
            }
        } catch (Throwable t) {
            println "Notice: Modrinth profile jar is locked (Minecraft running). Will attempt copy directly."
        }
    }
    from remapJar.archiveFile
    into "${System.getProperty('user.home')}/AppData/Roaming/ModrinthApp/profiles/vertex/mods"
    rename { "Vertex-Client-v1.0.4.jar" }
}

build.finalizedBy(copyToModrinth)


